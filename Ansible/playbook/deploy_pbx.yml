---
- name: Deploy kntu PBX Core Engine
  hosts: pbx_servers
  become: true

  tasks:
    - name: Ensure required packages are installed (RHEL/Rocky/CentOS)
      ansible.builtin.dnf:
        name:
          - podman
          - podman-compose
          - tar
          - gzip
        state: present

    - name: Create PBX core directory
      ansible.builtin.file:
        path: "/opt/kntu-pbx-core"
        state: directory
        mode: '0755'

    - name: Check if previous podman-compose.yml exists
      ansible.builtin.stat:
        path: "/opt/kntu-pbx-core/podman-compose.yml"
      register: old_compose

    - name: Tear down existing PBX container if running
      ansible.builtin.command:
        cmd: podman-compose down
        chdir: "/opt/kntu-pbx-core"
      when: old_compose.stat.exists
      register: teardown_result
      changed_when: "'Removing' in teardown_result.stdout or 'Stopping' in teardown_result.stdout"

    - name: Compress FreeSWITCH configuration locally (on your Ubuntu machine)
      ansible.builtin.command:
        cmd: tar -czf /tmp/freeswitch_config.tar.gz -C "{{ playbook_dir }}/../../config" freeswitch
      delegate_to: localhost
      run_once: true
      become: false

    - name: Send and extract FreeSWITCH configuration to remote server
      ansible.builtin.unarchive:
        src: "/tmp/freeswitch_config.tar.gz"
        dest: "/opt/kntu-pbx-core/"
        owner: root
        group: root

    - name: Copy podman-compose.yml to remote server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/podman-compose.yml"
        dest: "/opt/kntu-pbx-core/podman-compose.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Pull and start new PBX core container
      ansible.builtin.command:
        cmd: podman-compose up -d
        chdir: "/opt/kntu-pbx-core"
      register: compose_output
      changed_when: "'Starting' in compose_output.stdout or 'Pulling' in compose_output.stdout"

    - name: Check PBX core container status
      ansible.builtin.command: podman ps -f name=kntu_pbx_core
      register: container_status
      changed_when: false

    - name: Display PBX core container status
      ansible.builtin.debug:
        var: container_status.stdout_lines